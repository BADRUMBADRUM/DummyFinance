name: Build Mac App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: |
          pyinstaller --onefile --windowed --name DummyFinance main.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DummyFinance-macos
          path: dist/*
